<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>List Tag</h1>

    <!--Ordered list-->
    <!--<ol>-->
        <h2>Ordered list</h2>
        <ol type="1">
            <!--li- list item-->
            <li>Html</li>
            <li>css</li>
            <li>js</li>
        </ol>
        <ol type="A">
            <!--li-->
            <li>CSt</li>
            <li>Civil</li>
            <li>ET</li>
        </ol>
        <ol type="i">
            <!--li-->
            <li>Html</li>
            <li>css</li>
            <li>js</li>
            <li>py</li>
            <li>ts</li>
        </ol>

        <!-- HTML Unordered List-->
        <h2>Unordered List</h2>
        <ul type="disc">
            <li>app</li>
            <li>web</li>
            <li>game</li>
        </ul>
        <ul type="square">
            <li>app</li>
            <li>web</li>
            <li>game</li>
        </ul>
        <!--comment-->
</body>
</html>
